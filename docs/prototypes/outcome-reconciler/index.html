<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outcome Reconciler</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#e8edf2;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1060px;margin:auto;padding:56px 28px 80px}h1{font:600 clamp(34px,6vw,62px)/1.05 system-ui,sans-serif;letter-spacing:-.05em;margin:0 0 14px}.sub{color:#97a2ad;margin:0 0 44px}.sub b{color:#c5cdd5;font-weight:600}.grid{display:grid;grid-template-columns:310px 1fr;gap:28px}@media(max-width:760px){main{padding:36px 18px}.grid{grid-template-columns:1fr}}.panel,.stage{border:1px solid #27303a;background:#11161c;border-radius:12px}.panel{padding:20px}.stage{padding:24px;min-height:500px}h2{font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#96a1ab;margin:0 0 17px}.entry{border-top:1px solid #27303a;padding:14px 0}.entry:first-of-type{border-top:0;padding-top:0}label{display:block;color:#aeb8c1;font-size:12px;margin-bottom:4px}input,select{width:100%;border:1px solid #34404b;border-radius:6px;background:#0b0e12;color:#edf1f5;padding:8px;font:inherit}input+label{margin-top:9px}button{border:0;border-radius:6px;background:#c9ff5b;color:#101607;padding:9px 11px;font:700 12px system-ui,sans-serif;cursor:pointer;margin-top:11px}button:hover{background:#dbff91}.rule{margin-top:10px;border-top:1px solid #27303a;padding-top:18px}.rule p{font-size:12px;color:#9ba6af;margin:10px 0 0}.rule p b{color:#d5dde4}.empty{color:#77838e;margin:100px auto;text-align:center;max-width:320px}.summary{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:23px}.summary p{margin:4px 0 0;color:#9aa6b0;font-size:13px}.score{color:#c9ff5b;text-align:right;font:600 24px/1 system-ui,sans-serif}.score small{display:block;color:#8f9aa5;font:11px ui-monospace;margin-top:6px}.lane{position:relative;padding-left:118px;margin:23px 0}.lane-title{position:absolute;left:0;top:4px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8f9aa5}.track{height:46px;position:relative;border-top:1px solid #303a44;background:linear-gradient(90deg,transparent 49.8%,#202932 50%,transparent 50.2%)}.tick{position:absolute;top:-22px;color:#71808c;font-size:10px;transform:translateX(-50%)}.node{position:absolute;top:9px;width:13px;height:13px;border-radius:50%;transform:translateX(-50%);cursor:default}.intervention{background:#c9ff5b;box-shadow:0 0 0 4px #c9ff5b20}.outcome{background:#7ab6ff;box-shadow:0 0 0 4px #7ab6ff20}.node:hover:after{content:attr(data-tip);position:absolute;z-index:2;top:20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#222b34;color:#fff;padding:5px 7px;border-radius:4px;font-size:11px}.match{position:absolute;height:1px;background:#56636f;transform-origin:0 0;opacity:.8}.legend{display:flex;gap:18px;color:#9ba7b1;font-size:12px;margin-top:25px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.list{margin-top:30px;border-top:1px solid #27303a}.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:11px 0;border-bottom:1px solid #27303a;font-size:12px}.row span{color:#9ba7b1}.row b{font-weight:500;color:#dce4eb}.tag{color:#c9ff5b!important}.unmatched{color:#89949e!important}
</style></head><body><main>
<h1>Outcome Reconciler</h1><p class="sub">From <b>“Something that actually reads my training log”</b> + <b>“Eventual consistency and the reconciliation step”</b>.</p>
<div class="grid"><aside class="panel"><h2>Declare a change</h2><div class="entry"><label>Date</label><input id="idate" type="date"><label>Intervention</label><input id="iname" placeholder="e.g. added campus board"><button onclick="add('i')">Log intervention</button></div><h2 style="margin-top:22px">Observe an outcome</h2><div class="entry"><label>Date</label><input id="odate" type="date"><label>Outcome / signal</label><input id="oname" placeholder="e.g. sent V5 project"><button onclick="add('o')">Log outcome</button></div><div class="rule"><h2>Reconciliation rule</h2><select id="rule" onchange="render()"><option value="nearest">Nearest preceding intervention</option><option value="window">Only changes 14–56 days earlier</option><option value="all">Weighted recent history</option></select><p id="ruleText"></p></div></aside><section class="stage" id="view"></section></div>
</main><script>
let events=[
 {type:'i',date:'2026-03-02',name:'Begin finger-strength block'}, {type:'i',date:'2026-03-23',name:'Reduce volume; add rest day'},
 {type:'o',date:'2026-04-08',name:'First V5 send'}, {type:'i',date:'2026-04-20',name:'Start limit bouldering'},
 {type:'o',date:'2026-05-27',name:'Three V5 sends in a week'}, {type:'o',date:'2026-06-18',name:'Elbow discomfort'}];
const $=id=>document.getElementById(id), day=x=>new Date(x+'T00:00:00'), fmt=x=>day(x).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function add(type){let d=$(type+'date'),n=$(type+'name');if(!d.value||!n.value.trim())return;events.push({type,date:d.value,name:n.value.trim()});n.value='';render()}
function links(){let ints=events.filter(x=>x.type==='i').sort((a,b)=>day(a.date)-day(b.date)), outs=events.filter(x=>x.type==='o'), rule=$('rule').value;return outs.map(o=>{let prior=ints.filter(i=>day(i.date)<=day(o.date)), candidates=prior;if(rule==='window')candidates=prior.filter(i=>{let z=(day(o.date)-day(i.date))/864e5;return z>=14&&z<=56});if(!candidates.length)return {o};if(rule==='nearest')return {o,items:[candidates.at(-1)]};if(rule==='window')return {o,items:candidates};let weighted=candidates.map(i=>({...i,w:Math.exp(-((day(o.date)-day(i.date))/864e5)/35)}));return {o,items:weighted}})}
function render(){events.sort((a,b)=>day(a.date)-day(b.date));let rule=$('rule').value, copy={nearest:'Assign each outcome to the latest declared change before it.',window:'Merge only changes within the plausible 14–56 day feedback window.',all:'Keep every prior change, but decay its influence over 35 days.'};$('ruleText').innerHTML='<b>Merge:</b> '+copy[rule];if(!events.length){$('view').innerHTML='<p class="empty">Add events to make the two timelines disagree usefully.</p>';return}let min=day(events[0].date),max=day(events.at(-1).date),range=Math.max(1,max-min),pos=x=>8+84*(day(x.date)-min)/range, ls=links(), matched=ls.filter(x=>x.items).length;let ticks=[0,.5,1].map(v=>'<span class="tick" style="left:'+(8+84*v)+'%">'+fmt(new Date(min.getTime()+range*v).toISOString().slice(0,10))+'</span>').join('');let nodes=t=>events.filter(x=>x.type===t).map(x=>'<i class="node '+(t==='i'?'intervention':'outcome')+'" style="left:'+pos(x)+'%" data-tip="'+fmt(x.date)+' · '+x.name.replaceAll('"','&quot;')+'"></i>').join('');let relation=ls.flatMap(l=>(l.items||[]).map((i,k)=>'<div class="match" style="left:'+pos(i)+'%;top:'+(46+k*2)+'px;width:'+(pos(l.o)-pos(i))+'%"></div>')).join('');let details=ls.map(l=>'<div class="row"><span>'+fmt(l.o.date)+' · '+l.o.name+'</span><b class="'+(l.items?'tag':'unmatched')+'">'+(l.items?l.items.map(i=>i.name).join(' + '):'unreconciled')+'</b></div>').join('');$('view').innerHTML='<div class="summary"><div><h2>Reconciled timeline</h2><p>Hover a signal to inspect the declared and observed states.</p></div><div class="score">'+matched+'/'+ls.length+'<small>outcomes merged</small></div></div><div class="lane"><span class="lane-title">declared</span><div class="track">'+ticks+nodes('i')+'</div></div><div class="lane"><span class="lane-title">observed</span><div class="track">'+relation+nodes('o')+'</div></div><div class="legend"><span><i style="background:#c9ff5b"></i>intervention</span><span><i style="background:#7ab6ff"></i>outcome</span></div><div class="list">'+details+'</div>'}
let today=new Date().toISOString().slice(0,10);$('idate').value=today;$('odate').value=today;render();
</script></body></html>
