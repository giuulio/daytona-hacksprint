<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>inbox</title>
<style>
  :root {
    --bg: #0d0e12; --panel: #15171d; --line: #262a34;
    --fg: #e6e8ee; --dim: #8b90a0; --accent: #7aa2f7; --ok: #9ece6a; --bad: #f7768e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Inter", system-ui, sans-serif;
    padding: 48px 32px 96px;
  }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 40px; }
  section { margin-bottom: 56px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); font-weight: 600; margin: 0 0 16px; }
  textarea, input {
    width: 100%; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px; font: inherit; margin-bottom: 12px;
  }
  textarea { min-height: 120px; resize: vertical; }
  #focus { font-size: 14px; }
  #focus:focus { border-color: #7aa2f7; outline: none; }
  button {
    background: var(--accent); color: #0d0e12; border: 0; border-radius: 8px;
    padding: 12px 22px; font: 600 15px/1 inherit; cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; overflow-x: auto; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--dim); white-space: pre-wrap; margin: 16px 0 0;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card header { padding: 18px 18px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0 0 10px; color: var(--dim); font-size: 14px; }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; }
  .cite { font: 11px ui-monospace, Menlo, monospace; background: #1d2029; border: 1px solid var(--line); color: var(--accent); padding: 3px 7px; border-radius: 5px; }
  iframe { width: 100%; height: 320px; border: 0; border-top: 1px solid var(--line); background: #000; }
  .status { font-size: 13px; color: var(--dim); margin: 12px 0 20px; min-height: 20px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .status div { opacity: 0.55; }
  .status div:last-child { opacity: 1; color: var(--fg); }
  .phase { margin-top: 12px; font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .pulse { color: var(--accent); animation: p 1s steps(1) infinite; }
  @keyframes p { 50% { opacity: 0.25; } }
  .fail { color: var(--bad); padding: 18px; font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: #1d2029; color: var(--dim); margin-left: 8px; }
  .badge.live { color: var(--ok); }
  .embed, .embed body { height: 100%; }
  .embed body { padding: 16px 18px 24px; }
  .embed h1, .embed .sub, .embed #capSection { display: none; }
  .embed main { max-width: none; }
  .embed h2 { margin-bottom: 10px; }
  .embed section { margin-bottom: 0; }
  .embed .grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .embed iframe { height: 260px; }
</style>
</head>
<body>
<main>
  <h1>inbox</h1>
  <p class="sub">Everything I read, filed automatically — then mined for the ideas hiding between unrelated notes.</p>

  <section id="capSection">
    <h2>1 · Capture</h2>
    <textarea id="text" placeholder="Paste anything. The macOS shortcut sends here too."></textarea>
    <input id="note" placeholder="Optional note to your future self" />
    <input id="url" placeholder="Source URL (optional)" />
    <button id="capture">Capture &amp; file</button>
    <div class="status" id="capStatus"></div>
    <pre id="diff" hidden></pre>
  </section>

  <section>
    <h2>2 · Synthesize</h2>
    <input id="focus" placeholder="Optional — steer it. e.g. &quot;from my latest two sources, build one prototype&quot;" />
    <button id="synth">Find overlaps &amp; build prototypes</button>
    <button id="loadCached" class="ghost">Load cached</button>
    <div class="status" id="synthStatus"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// ?embed=1 — rendered inside the HUD's Synthesize tab, where capture already
// has its own surface and the outer chrome is redundant.
if (new URLSearchParams(location.search).get('embed')) {
  document.documentElement.classList.add('embed');
}

$('capture').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) return;
  $('capture').disabled = true;
  $('capStatus').textContent = 'filing…';
  const t0 = Date.now();
  try {
    const r = await fetch('/capture', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, note: $('note').value, sourceUrl: $('url').value, sourceApp: 'web' }),
    }).then((r) => r.json());
    if (r.ok) {
      $('capStatus').textContent = `filed in ${((Date.now() - t0) / 1000).toFixed(1)}s → ${r.changedFiles.join(', ')}`;
      $('diff').hidden = false;
      $('diff').textContent = r.diffStat || '(no diff)';
      $('text').value = ''; $('note').value = ''; $('url').value = '';
    } else {
      $('capStatus').textContent = 'failed: ' + r.error;
    }
  } catch (e) { $('capStatus').textContent = 'failed: ' + e.message; }
  $('capture').disabled = false;
};

function render(list) {
  $('grid').innerHTML = list.map((p) => `
    <div class="card">
      <header>
        <h3>${esc(p.title)}${p.ok === false ? '<span class="badge">cached</span>' : '<span class="badge live">live sandbox</span>'}</h3>
        <p>${esc(p.oneLiner || '')}</p>
        <p style="color:#6c7086">${esc(p.whyYou || '')}</p>
        <div class="cites">${(p.sourceNotes || []).map((f) => `<span class="cite">${esc(f)}</span>`).join('')}</div>
      </header>
      ${p.url ? `<iframe src="${p.url}" loading="lazy"></iframe>`
        : p.slug ? `<iframe src="/p/${p.slug}" loading="lazy"></iframe>`
        : `<div class="fail">${esc(p.error || 'no prototype')}</div>`}
    </div>`).join('');
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Streamed synthesis. Ideas + citations arrive ~45s before the prototypes, so
// cards render early and each fills in as its sandbox boots and Codex writes.
$('synth').onclick = () => {
  $('synth').disabled = true;
  $('grid').innerHTML = '';
  const log = [];
  const t0 = Date.now();
  const el = (s) => document.querySelector(`[data-slug="${s}"] .phase`);
  const say = (m) => {
    log.push(`${((Date.now() - t0) / 1000).toFixed(1)}s  ${m}`);
    $('synthStatus').innerHTML = log.slice(-4).map((l) => `<div>${esc(l)}</div>`).join('');
  };

  const focus = $('focus').value.trim();
  const es = new EventSource('/synthesize/stream' + (focus ? `?focus=${encodeURIComponent(focus)}` : ''));
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    switch (d.type) {
      case 'status':   say(d.msg); break;
      case 'indexed':  say(`indexed ${d.notes} notes`); break;
      case 'overlaps_ms': say(`overlaps found in ${(d.ms / 1000).toFixed(1)}s`); break;

      case 'ideas':
        say(`${d.ideas.length} ideas proposed, fanning out`);
        $('grid').innerHTML = d.ideas.map((p) => `
          <div class="card" data-slug="${p.slug}">
            <header>
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.oneLiner || '')}</p>
              <p style="color:#6c7086">${esc(p.whyYou || '')}</p>
              <div class="cites">${(p.sourceNotes || []).map((f) => `<span class="cite">${esc(f)}</span>`).join('')}</div>
              <div class="phase">queued…</div>
            </header>
          </div>`).join('');
        break;

      case 'sandbox_up':
        if (el(d.slug)) el(d.slug).innerHTML = `<span class="ok">●</span> sandbox ${esc(d.sandboxId)} up in ${d.ms}ms`;
        say(`sandbox ${d.sandboxId} up in ${d.ms}ms`);
        break;

      case 'building':
        if (el(d.slug)) el(d.slug).innerHTML = `<span class="pulse">◐</span> codex writing index.html…`;
        break;

      case 'live': {
        const card = document.querySelector(`[data-slug="${d.slug}"]`);
        if (card) {
          el(d.slug).innerHTML = `<span class="ok">✓</span> live · ${d.lines} lines · ${(d.ms / 1000).toFixed(1)}s`;
          const f = document.createElement('iframe');
          f.src = d.url; f.loading = 'lazy';
          card.appendChild(f);
        }
        say(`${d.slug} live in ${(d.ms / 1000).toFixed(1)}s`);
        break;
      }

      case 'failed': {
        const card = document.querySelector(`[data-slug="${d.slug}"]`);
        if (card) {
          el(d.slug).innerHTML = `<span class="bad">✕</span> ${esc(d.error)}`;
          const f = document.createElement('iframe');   // INVARIANT 6: fall back to cache
          f.src = `/p/${d.slug}`; f.loading = 'lazy';
          card.appendChild(f);
        }
        say(`${d.slug} failed — falling back to cache`);
        break;
      }

      case 'done':
        say(`${d.live}/${d.total} live · ${(d.ms / 1000).toFixed(1)}s · ${d.sandboxesCreated} sandboxes created`);
        es.close(); $('synth').disabled = false;
        break;

      case 'error':
        say('failed: ' + d.error + ' — showing cached');
        render((d.cached || []).map((x) => ({ ...x, ok: false })));
        es.close(); $('synth').disabled = false;
        break;
    }
  };
  es.onerror = () => { say('stream lost'); es.close(); $('synth').disabled = false; };
};

async function loadCached() {
  const c = await fetch('/api/cached').then((r) => r.json());
  $('synthStatus').textContent = `${c.length} cached prototype(s)`;
  render(c.map((x) => ({ ...x, ok: false })));
}
$('loadCached').onclick = loadCached;

// ?demo=1 renders the warm cached grid on load — the path that does not depend
// on live generation succeeding.
if (new URLSearchParams(location.search).get('demo')) loadCached();
</script>
</body>
</html>
