<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>inbox capture</title>
<style>
  :root {
    --fg: #f2f3f7; --dim: #9aa0b0; --faint: #6b7183;
    --accent: #8fb0ff; --ok: #9ece6a; --bad: #f7768e;
    --line: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.5 -apple-system, ui-sans-serif, system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    display: flex;
  }

  .hud {
    flex: 1; margin: 10px; border-radius: 16px;
    background: rgba(22,24,31,0.62);
    border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    display: flex; flex-direction: column; overflow: hidden;
    animation: rise 0.16s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(0.985); } }

  /* drag by the top strip, but keep inputs clickable */
  .bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 9px;
    padding: 13px 16px 11px; border-bottom: 1px solid var(--line);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .src { font: 500 12px/1 inherit; color: var(--dim); letter-spacing: 0.01em;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src b { color: var(--fg); font-weight: 500; }
  .esc { -webkit-app-region: no-drag; margin-left: auto; font: 11px ui-monospace, Menlo, monospace;
         color: var(--dim); background: rgba(255,255,255,0.07); border: 1px solid var(--line);
         border-radius: 5px; padding: 3px 7px; letter-spacing: .04em; }

  .quote {
    padding: 14px 17px 2px;
    font: 15px/1.5 ui-serif, Georgia, "Times New Roman", serif;
    color: #eceef4;
    max-height: 88px; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 0, #000 80%, transparent 100%);
            mask-image: linear-gradient(#000 0, #000 80%, transparent 100%);
  }
  .quote.empty { color: var(--faint); font-style: italic; font-family: inherit; font-size: 13px; }
  .meta { padding: 2px 17px 0; font: 11px ui-monospace, Menlo, monospace; color: #7f8698;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .row { display: flex; align-items: center; gap: 10px; padding: 12px 16px 14px; }
  input {
    -webkit-app-region: no-drag;
    flex: 1; background: rgba(255,255,255,0.05); color: var(--fg);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; font: inherit; outline: none;
    transition: border-color 0.14s, background 0.14s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: rgba(143,176,255,0.55); background: rgba(143,176,255,0.07); }
  .kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); flex: none;
         background: rgba(255,255,255,0.07); border: 1px solid var(--line);
         border-radius: 5px; padding: 5px 8px; }

  .state { display: none; padding: 14px 17px 16px; align-items: center; gap: 10px; font-size: 13px; }
  .state.on { display: flex; }
  .spin { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.18);
          border-top-color: var(--accent); border-radius: 50%; animation: sp 0.7s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .route { font: 12px ui-monospace, Menlo, monospace; color: var(--ok); }
  .err { color: var(--bad); font-size: 12px; }
  .hide { display: none !important; }
</style>
</head>
<body>
  <div class="hud">
    <div class="bar">
      <span class="dot"></span>
      <span class="src" id="src">inbox</span>
      <span class="esc">esc</span>
    </div>

    <div id="main">
      <div class="quote empty" id="quote">Nothing selected — highlight some text and try again.</div>
      <div class="meta" id="meta"></div>
      <div class="row">
        <input id="note" placeholder="Add a note for your future self… (optional)" autofocus />
        <span class="kbd">⏎ file</span>
      </div>
    </div>

    <div class="state" id="busy"><span class="spin"></span><span>filing into the vault…</span></div>
    <div class="state" id="done"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let payload = { text: '', sourceApp: '', sourceUrl: '' };

function show(el) { ['main','busy','done'].forEach((i) => $(i).classList.toggle('hide', i !== el)); $(el).classList.add(el === 'main' ? 'x' : 'on'); }

// Browser preview: open hud.html?demo=1 to iterate on the design without Electron.
const IN_ELECTRON = !!window.inbox;
if (!IN_ELECTRON) {
  window.inbox = { onSelection: (f) => { window.__fill = f; }, submit: async () => ({ ok: true, changedFiles: ['sources/attention-is-all-you-need.md'] }), dismiss(){}, resize(){}, openVault(){} };
}

window.inbox.onSelection((d) => {
  payload = d;
  $('src').innerHTML = d.sourceApp ? `from <b>${esc(d.sourceApp)}</b>` : 'inbox';
  const q = $('quote');
  if (d.text) { q.textContent = d.text.trim(); q.classList.remove('empty'); }
  else { q.textContent = 'Nothing selected — highlight some text and try again.'; q.classList.add('empty'); }
  $('meta').textContent = d.sourceUrl || '';
  $('note').value = '';
  $('busy').classList.remove('on'); $('done').classList.remove('on');
  $('main').classList.remove('hide');
  setTimeout(() => $('note').focus(), 30);
});

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

if (!IN_ELECTRON && new URLSearchParams(location.search).get('demo')) {
  window.__fill({
    text: 'We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely.',
    sourceApp: 'Safari',
    sourceUrl: 'https://arxiv.org/abs/1706.03762',
  });
}

document.addEventListener('keydown', async (e) => {
  if (e.key === 'Escape') return window.inbox.dismiss();
  if (e.key !== 'Enter') return;
  if (!payload.text?.trim()) return window.inbox.dismiss();

  $('main').classList.add('hide');
  $('busy').classList.add('on');

  try {
    const r = await window.inbox.submit({ ...payload, note: $('note').value });
    $('busy').classList.remove('on');
    $('done').classList.add('on');
    if (r.ok) {
      const files = (r.changedFiles || []).filter((f) => !f.startsWith('inbox/'));
      $('done').innerHTML = `<span style="color:var(--ok)">✓</span>
        <span>filed to</span> <span class="route">${esc(files[0] || 'the vault')}</span>`;
      setTimeout(() => window.inbox.dismiss(), 2200);
    } else {
      $('done').innerHTML = `<span class="err">✕ ${esc(String(r.error).slice(0, 90))}</span>`;
      setTimeout(() => window.inbox.dismiss(), 3200);
    }
  } catch (err) {
    $('busy').classList.remove('on');
    $('done').classList.add('on');
    $('done').innerHTML = `<span class="err">✕ server not running — npm run dev</span>`;
    setTimeout(() => window.inbox.dismiss(), 3200);
  }
});
</script>
</body>
</html>
