<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>inbox capture</title>
<style>
  :root {
    --fg: #f4f4f8; --dim: #a2a6b6; --faint: #757b8e;
    --violet: #a78bfa; --violet-soft: rgba(167,139,250,0.30);
    --violet-line: rgba(167,139,250,0.55);
    --ok: #9ece6a; --amber: #e0af68; --bad: #f7768e;
    --line: rgba(255,255,255,0.11);
  }
  * { box-sizing: border-box; }
  /* full-bleed: the window IS the HUD. Any gap here shows raw vibrancy. */
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; }
  body {
    font: 14px/1.5 -apple-system, ui-sans-serif, system-ui, sans-serif;
    color: var(--fg); -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
    border-radius: 14px; border: 1px solid var(--line);
    background: rgba(18,19,26,0.58);
    animation: rise .13s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(5px) scale(.99); } }

  header {
    -webkit-app-region: drag; overflow: hidden;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 9px 7px 12px; flex: none;
  }
  .srcrow {
    -webkit-app-region: drag; overflow: hidden;
    display: flex; align-items: center; gap: 8px;
    padding: 0 13px 8px; flex: none;
  }
  .srcrow.hide { display: none !important; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); flex: none;
         box-shadow: 0 0 0 3px rgba(167,139,250,0.18); }
  .src { font-size: 12px; color: var(--fg); white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .src b { color: var(--fg); font-weight: 600; }
  .url { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); margin-left: auto;
         min-width: 0; flex: 0 1 auto; white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; direction: rtl; text-align: right; }
  .x { -webkit-app-region: no-drag; flex: none; width: 22px; height: 22px; border-radius: 6px;
       border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--dim);
       font: 13px/1 -apple-system, system-ui; cursor: pointer; padding: 0; margin-left: auto; }
  .x:hover { background: rgba(247,118,142,0.16); color: #ffb3c0; border-color: rgba(247,118,142,.4); }

  .tabs { -webkit-app-region: no-drag; display: flex; gap: 2px;
          background: rgba(255,255,255,.05); border: 1px solid var(--line);
          border-radius: 7px; padding: 2px; flex: none; }
  .tab { border: 0; background: transparent; color: var(--dim); cursor: pointer;
         border-radius: 5px; padding: 5px 9px; font: 600 11px/1 -apple-system, system-ui; }
  .tab.on { background: rgba(167,139,250,.22); color: #cbb8ff; }

  body.dashmode { height: 100vh; }
  #dash { flex: 1 1 auto; min-height: 0; display: none; }
  #dash.on { display: block; }
  #dash iframe { display: block; width: 100%; height: 100%; border: 0;
                 border-radius: 0 0 13px 13px; background: #0d0e12; }

  .capture { padding: 2px 13px 0; }
  .mark {
    overflow-wrap: anywhere;
    font: 15px/1.75 ui-serif, Georgia, "Times New Roman", serif;
    background: linear-gradient(transparent 10%, var(--violet-soft) 10%, var(--violet-soft) 90%, transparent 90%);
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    padding: 1px 4px; border-radius: 2px;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mark.empty, .mark.reading { font-family: inherit; font-size: 14px; color: #ded8f8; }
  .mark.reading { background: linear-gradient(transparent 10%, rgba(167,139,250,.16) 10%,
                  rgba(167,139,250,.16) 90%, transparent 90%); animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .5; } }

  .row { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 7px; padding: 10px 13px 12px; }
  input { -webkit-user-select: text; user-select: text;
    flex: 1 1 auto; min-width: 0;
    background: rgba(255,255,255,.06); color: var(--fg);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px;
    font-size: 13px; font-family: inherit; outline: none; transition: border-color .14s, background .14s;
  }
  input::placeholder { color: #8d93a5; }
  input:focus { border-color: var(--violet-line); background: rgba(167,139,250,.09); }
  input:disabled { opacity: .45; }

  button.act {
    flex: none; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--violet); color: #16121f;
    font: 600 13px/1 -apple-system, system-ui, sans-serif;
    padding: 10px 12px; display: flex; align-items: center; gap: 5px; white-space: nowrap;
    transition: filter .14s, opacity .14s;
  }
  button.act:hover:not(:disabled) { filter: brightness(1.1); }
  button.act:disabled { opacity: .35; cursor: default; }
  button.act .ret { font: 11px ui-monospace, Menlo, monospace; opacity: .6; }

  /* ---- session log ---- */
  .sess { border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sesshead {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px 7px; flex: none;
    white-space: nowrap; overflow: hidden;
    font: 11px ui-monospace, Menlo, monospace; color: var(--dim);
    text-transform: uppercase; letter-spacing: .07em;
  }
  .fileall {
    -webkit-app-region: no-drag; margin-left: auto; border: 1px solid var(--violet-line);
    background: rgba(167,139,250,.12); color: #cbb8ff; border-radius: 7px;
    font: 600 11px/1 -apple-system, system-ui; padding: 6px 8px; cursor: pointer; flex: none;
  }
  .fileall:disabled { opacity: .3; cursor: default; }
  .list { overflow-y: auto; max-height: 320px; padding: 0 8px 10px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 4px; }
  .item {
    display: flex; align-items: flex-start; gap: 8px; min-width: 0; padding: 8px 6px;
    border-radius: 8px; font-size: 12.5px;
  }
  .item:hover { background: rgba(255,255,255,.04); }
  .pip { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-top: 6px; }
  .pip.saved { background: var(--amber); }
  .pip.filing { background: var(--violet); animation: breathe .9s ease-in-out infinite; }
  .pip.filed { background: var(--ok); }
  .pip.error { background: var(--bad); }
  .itext { flex: 1; min-width: 0; }
  .isnip { color: var(--fg); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2;
           -webkit-box-orient: vertical; overflow: hidden; }
  .istat { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); margin-top: 2px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .istat.filed { color: var(--ok); }
  .istat.error { color: var(--bad); }
  .ifile {
    -webkit-app-region: no-drag; flex: none; border: 1px solid var(--line);
    background: rgba(255,255,255,.05); color: var(--dim); border-radius: 6px;
    font: 600 11px/1 -apple-system, system-ui; padding: 6px 8px; cursor: pointer;
  }
  .ifile:hover { border-color: var(--violet-line); color: #cbb8ff; }
  .empty-list { padding: 4px 16px 12px; font-size: 12px; color: var(--dim); }
  .links { -webkit-app-region: no-drag; display: flex; gap: 7px;
           padding: 0 13px 12px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 10px; }
  .lnk { flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,.05);
         color: var(--dim); border-radius: 7px; padding: 8px 6px; cursor: pointer;
         font: 600 11px/1 -apple-system, system-ui; }
  .lnk:hover { border-color: var(--violet-line); color: #cbb8ff; background: rgba(167,139,250,.10); }
  .hide { display: none !important; }
</style>
</head>
<body>
  <header>
    <span class="tabs">
      <button class="tab on" id="tabCap">Capture</button>
      <button class="tab" id="tabDash">Synthesize</button>
    </span>
    <button class="x" id="close" title="Close (esc)">✕</button>
  </header>
  <div class="srcrow" id="srcrow">
    <span class="dot"></span>
    <span class="src" id="src">inbox</span>
    <span class="url" id="url"></span>
  </div>

  <div class="capture" id="cap">
    <span class="mark empty" id="mark">Highlight anything — it appears here live. ⏎ or Save to keep it.</span>
  </div>
  <div class="row" id="foot">
    <input id="note" placeholder="Add a note for your future self… (optional)" />
    <button class="act" id="save"><span>Save</span><span class="ret">⏎</span></button>
  </div>

  <div id="dash"><iframe id="dashFrame" src="about:blank"></iframe></div>

  <div class="sess" id="sess">
    <div class="sesshead">
      <span id="sesscount">this session · 0</span>
      <button class="fileall" id="fileall" disabled>File all</button>
    </div>
    <div class="empty-list" id="emptyList">Nothing saved yet. Saving is instant; filing runs the agent.</div>
    <div class="list hide" id="list"></div>
    <div class="links">
      <button class="lnk" id="openVault">Open vault ↗</button>
      <button class="lnk" id="openDash">Dashboard ↗</button>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let payload = { text: '', sourceApp: '', sourceUrl: '' };
let tab = 'cap';
const session = [];           // survives for the life of the window
let seq = 0;

const IN_ELECTRON = !!window.inbox;
if (!IN_ELECTRON) {
  window.inbox = {
    onSelection: (f) => { window.__fill = f; }, onSource: () => {}, onPending: () => {},
    save: async () => ({ ok: true, inbox: 'inbox/2026-08-30-demo.md' }),
    file: async () => ({ ok: true, changedFiles: ['sources/attention-is-all-you-need.md'] }),
    dismiss(){}, resize(){}, openVault(){}, openDashboard(){}, resume(){}, shape(){},
  };
}

function fit() {
  if (tab === 'dash') return;
  requestAnimationFrame(() => {
    const h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h > 40) window.inbox.resize(h);
  });
}

function paintSource(d) {
  payload.sourceApp = d.sourceApp || payload.sourceApp;
  payload.sourceUrl = d.sourceUrl || payload.sourceUrl;
  $('src').innerHTML = payload.sourceApp ? `from <b>${esc(payload.sourceApp)}</b>` : 'inbox';
  $('url').textContent = payload.sourceUrl || '';
}
window.inbox.onSource(paintSource);

window.inbox.onPending(() => {
  payload = { text: '', sourceApp: '', sourceUrl: '' };
  $('src').textContent = 'inbox';
  $('url').textContent = '';
  const m = $('mark');
  m.textContent = 'tracking your selection — highlight anything';
  m.className = 'mark reading';
  $('note').value = '';
  $('note').disabled = true;
  $('save').disabled = true;
  fit();
});

// Fires repeatedly while the selection is being tracked live, so it must never
// clear the note field or grab focus — doing either would fight the user.
window.inbox.onSelection((d) => {
  payload = { ...payload, ...(d || {}) };
  const has = !!(payload.text && payload.text.trim());
  paintSource(payload);
  const m = $('mark');
  m.textContent = has ? payload.text.trim()
    : 'Highlight anything — it appears here live. ⏎ or Save to keep it.';
  m.className = has ? 'mark' : 'mark empty';
  $('note').disabled = !has;
  $('save').disabled = !has;
  fit();
});

function render() {
  $('sesscount').textContent = `this session · ${session.length}`;
  const unfiled = session.filter((i) => i.status === 'saved').length;
  $('fileall').disabled = unfiled === 0;
  $('fileall').textContent = unfiled ? `File all (${unfiled})` : 'File all';
  $('emptyList').classList.toggle('hide', session.length > 0);
  $('list').classList.toggle('hide', session.length === 0);

  $('list').innerHTML = session.map((i) => {
    const stat = i.status === 'filed' ? `→ ${esc(i.route)}`
      : i.status === 'filing' ? 'filing — the agent is routing it…'
      : i.status === 'error' ? esc(i.error || 'failed')
      : 'in inbox · unfiled';
    return `<div class="item">
      <span class="pip ${i.status}"></span>
      <span class="itext">
        <div class="isnip">${esc(i.text.slice(0, 96))}</div>
        <div class="istat ${i.status}">${stat}</div>
      </span>
      ${i.status === 'saved' ? `<button class="ifile" data-id="${i.id}">File</button>` : ''}
    </div>`;
  }).join('');

  $('list').querySelectorAll('.ifile').forEach((b) => {
    b.onclick = () => fileOne(session.find((x) => x.id === Number(b.dataset.id)));
  });
  fit();
}

/** SAVE — instant. Writes to inbox/ and returns; no agent involved. */
async function save() {
  if (!payload.text?.trim()) return;
  const item = {
    id: ++seq, text: payload.text.trim(), note: $('note').value,
    sourceApp: payload.sourceApp, sourceUrl: payload.sourceUrl,
    status: 'saved', inbox: '', route: '', error: '',
  };
  session.unshift(item);
  render();

  // clear the capture area immediately — the round-trip is not worth waiting on
  payload = { text: '', sourceApp: payload.sourceApp, sourceUrl: payload.sourceUrl };
  $('mark').textContent = 'Highlight anything — it appears here live. ⏎ or Save to keep it.';
  $('mark').className = 'mark empty';
  $('note').value = '';
  $('note').disabled = true;
  $('save').disabled = true;

  const r = await window.inbox.save({
    text: item.text, note: item.note, sourceApp: item.sourceApp, sourceUrl: item.sourceUrl,
  });
  if (r.ok) { item.inbox = r.inbox; }
  else { item.status = 'error'; item.error = String(r.error).slice(0, 80); }
  render();
  // Hand focus back to the source app; tracking only runs while we are unfocused,
  // which is why a second highlight used to go unnoticed after the first save.
  window.inbox.resume();
}

/** FILE — slow. Codex reads the vault and decides where this belongs. */
async function fileOne(item) {
  if (!item || item.status !== 'saved' || !item.inbox) return;
  item.status = 'filing';
  render();
  try {
    const r = await window.inbox.file({ inbox: item.inbox });
    if (r.ok) {
      const files = (r.changedFiles || []).filter((f) => !f.startsWith('inbox/'));
      item.status = 'filed';
      item.route = files[0] || 'the vault';
    } else {
      item.status = 'error'; item.error = String(r.error).slice(0, 80);
    }
  } catch {
    item.status = 'error'; item.error = 'server unreachable';
  }
  render();
}

async function fileAll() {
  for (const i of session.filter((x) => x.status === 'saved')) await fileOne(i);
}

$('save').onclick = save;
$('fileall').onclick = fileAll;
function setTab(next) {
  tab = next;
  const dash = next === 'dash';
  $('tabCap').classList.toggle('on', !dash);
  $('tabDash').classList.toggle('on', dash);
  $('cap').classList.toggle('hide', dash);
  $('foot').classList.toggle('hide', dash);
  $('sess').classList.toggle('hide', dash);
  $('dash').classList.toggle('on', dash);
  $('srcrow').classList.toggle('hide', dash);
  document.body.classList.toggle('dashmode', dash);
  if (dash) {
    // load lazily so the capture tab never waits on the server
    if ($('dashFrame').src === 'about:blank') $('dashFrame').src = 'http://localhost:3737/?embed=1';
    window.inbox.shape('dash');
  } else {
    window.inbox.shape('cap');
    fit();
  }
}
$('tabCap').onclick = () => setTab('cap');
$('tabDash').onclick = () => setTab('dash');

$('close').onclick = () => window.inbox.dismiss();
$('openVault').onclick = () => window.inbox.openVault();
$('openDash').onclick = () => window.inbox.openDashboard();
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return window.inbox.dismiss();
  if (e.key === 'Enter' && !$('save').disabled) { e.preventDefault(); save(); }
});

render();

if (!IN_ELECTRON) {
  const q = new URLSearchParams(location.search);
  if (q.get('demo')) window.__fill({
    text: 'We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely.',
    sourceApp: 'Safari', sourceUrl: 'https://arxiv.org/abs/1706.03762',
  });
  if (q.get('session')) {
    session.push(
      { id: ++seq, text: 'Desire paths: worn tracks across grass where the paving does not go.', status: 'filed', route: 'topics/desire-paths.md', inbox: 'x' },
      { id: ++seq, text: 'Progressive disclosure keeps an interface focused on the choices needed now.', status: 'filing', inbox: 'x' },
      { id: ++seq, text: 'The Transformer dispenses with recurrence and convolutions entirely.', status: 'saved', inbox: 'x' },
    );
    window.__fill({ text: '', sourceApp: 'Safari', sourceUrl: 'https://arxiv.org/abs/1706.03762' });
    render();
  }
}

</script>
</body>
</html>
